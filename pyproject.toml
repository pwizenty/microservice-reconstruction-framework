[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "microservice-reconstruction-framework"
version = "0.0.1"
description = "Reconstructs microservice architecture models from source code via technology plugins."
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Philip Wizenty" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
# Runtime dependencies only. argparse, pathlib and dataclasses are stdlib and
# must NOT be listed; pandas is currently unused and was dropped.
# ljavalang (NOT javalang): fork with Java 9-22 support (records etc.), see ADR-0003.
dependencies = [
    "ljavalang>=2.1",
    "pymongo>=4.8",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/pwizenty/microservice-reconstruction-framework"

[project.scripts]
mrf = "mrf.main:main"

# Plugin discovery via entry points – enable once ADR-0002 is accepted.
# [project.entry-points."mrf.plugins"]
# java = "mrf.plugins.data.java.java_plugin:JavaPlugin"
# spring = "mrf.plugins.service.spring.spring_plugin:SpringPlugin"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "deepdiff>=8.0",
    "mongomock>=4.2",
    "mypy>=1.13",
    "types-PyYAML",
    "ruff>=0.8",
    "pre-commit>=4.0",
    "debugpy",
]
integration = [
    "testcontainers[mongodb]>=4.8",
]
docs = [
    "sphinx>=8.0",
    "furo",
    "myst-parser>=4.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["mrf"]

[tool.hatch.build.targets.sdist]
include = ["mrf", "README.rst", "LICENSE"]

# --------------------------------------------------------------------------- #
# Ruff: linting + formatting (replaces manual PEP 8 checks)
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 88
target-version = "py312"
src = ["mrf", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear (mutable defaults, etc.)
    "UP",       # pyupgrade
    "SIM",      # simplify
    "D",        # pydocstyle
    "T20",      # print statements -> use logging
    "TID",      # tidy imports
    "RUF",
]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
# Forbid imports that only work when mrf/ itself is on sys.path

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"utilities".msg = "Import from 'mrf.utilities' instead."
"plugins".msg = "Import from 'mrf.plugins' instead."
"modules".msg = "Import from 'mrf.modules' instead."
"repositories".msg = "Import from 'mrf.repositories' instead."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "T20"]
"docs/**" = ["D"]

# --------------------------------------------------------------------------- #
# mypy: start lenient, tighten per module over time
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.12"
packages = ["mrf"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
# Flip to true module by module (see [[tool.mypy.overrides]] below)
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["javalang.*", "mongomock.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mrf.modules.*"]
disallow_untyped_defs = true

# --------------------------------------------------------------------------- #
# pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: needs Docker/MongoDB (run with: uv run pytest -m integration)",
    "golden: compares reconstruction output against tests/fixtures/*/expected.json",
]

[tool.coverage.run]
source = ["mrf"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
